name: Sync public food data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import MFDS data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MFDS_API_KEY: ${{ secrets.MFDS_API_KEY }}
          SYNC_MAX_PAGES: ${{ vars.SYNC_MAX_PAGES || '10' }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$MFDS_API_KEY" ]; then
            echo "DATABASE_URL and MFDS_API_KEY must be configured in GitHub Actions secrets."
            exit 1
          fi
          python -m rpa.sync_foods
